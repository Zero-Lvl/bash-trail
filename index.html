link output, output inside root, malformed scanner report, and scanner invocation failure.","Additional interruption, publication-failure, permission-denial where possible, duplicate-option, and repeated-run evidence in test-notes.md. A repeated successful target is refused until the learner deliberately chooses a fresh output path.","A final self-review recording observed stdout, stderr, status, output existence/content, input preservation, and staging cleanup for every case. This is your local evidence, not browser-executed certification."],"research":[{"label":"Bash arrays for argument forwarding","url":"https://www.gnu.org/software/bash/manual/html_node/Arrays.html"},{"label":"Bash traps","url":"https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html"},{"label":"Python JSON validation and serialization","url":"https://docs.python.org/3/library/json.html"},{"label":"Python unittest for regression tests","url":"https://docs.python.org/3/library/unittest.html"}],"hints":["Draw the phases: validate options and destination, scan, validate structured report, stage if publishing, publish, clean up. State what each phase may change.","Use arrays for process arguments and a JSON parser for report fields. Resolve root/output relationships deliberately; string prefixes alone do not establish directory containment.","Keep the final path untouched until a complete valid report is ready. Preserve scanner failures instead of publishing partial success, test with disposable scanner doubles, and scope every cleanup action to staging allocated by this run."],"checks":["Run all twelve required regression cases and record the actual results; the browser cannot execute or certify them.","For the main fixture, dry-run emits the same parsed seven-file report as publication while leaving output absent and inputs unchanged.","Normal publication creates one complete JSON output outside the root, identical in parsed value to stdout, with no staging directory left.","Existing outputs, broken symlinks, inside-root output paths, and duplicate options are refused before persistent changes; the unrelated sentinel remains byte-identical.","Invalid root returns the scanner's validated partial JSON with status 3 and no output; malformed/invocation failures return status 5 with zero stdout bytes.","Use a disposable slow scanner double for TERM testing; verify parent cleanup and explicitly account for the direct child rather than claiming arbitrary process-tree control.","Simulate publication failure in a controlled user-owned fixture and verify status 4, empty stdout, no partial final file, and scoped cleanup.","Test adversarial names as literal data, including whitespace, wildcard-like punctuation, dollar signs, leading hyphens, and the real newline.","Review every expansion, subprocess call, and JSON boundary: no eval, no shell=True, no parsed directory listings, no download-and-execute, no elevation.","Record unsupported/skipped permission tests honestly, document residual races and interruption limits, and revisit any failed fixture before marking your local work complete."],"quiz":[{"prompt":"When may the final manifest path receive the completed report?","options":["Before scanning so it can double as scratch space","After the first filename is found","After successful scanning and structured validation, with publication checks satisfied","Whenever a quiz answer is correct"],"correct":2,"clue":"Review phase boundaries and the rule against success-shaped partial artifacts."},{"prompt":"Why reject a manifest output located inside the scan root?","options":["JSON cannot exist in directories","Bash cannot pass absolute paths","It makes every filename a shell command","Publishing there would change the dataset being reported and complicate repeatability"],"correct":3,"clue":"Consider whether the report should become one of its own future inputs."}]}]}]}</script>
<script>(()=>{
'use strict';
const STORAGE_KEY='bash-trail.progress.v1';
const MAX_BACKUP_BYTES=16*1024*1024;
const fail = () => { throw new Error('Invalid backup: use an unmodified Bash Trail progress export for this course version.'); };
const record = value => value !== null && typeof value === 'object' && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype;
const exactKeys = (value,keys) => record(value) && Object.keys(value).length===keys.length && keys.every(k=>Object.hasOwn(value,k));
function parseProgress(course,text) {
  if(typeof text!=='string' || new TextEncoder().encode(text).byteLength>MAX_BACKUP_BYTES) fail();
  let value;
  try { value=JSON.parse(text); } catch { fail(); }
  if(!exactKeys(value,['schema','courseVersion','missions','exams','drafts','lastMission']) || value.schema!==1 || value.courseVersion!==course.version) fail();
  const missions=allMissions(course);
  const ids=new Set(missions.map(m=>m.id));
  if(value.lastMission!==null && !ids.has(value.lastMission)) fail();
  if(!record(value.missions) || !record(value.exams) || !record(value.drafts)) fail();
  for(const [id,passed] of Object.entries(value.missions)) if(!ids.has(id) || passed!==true) fail();
  for(const [id,passed] of Object.entries(value.exams)) {
    const section=course.sections.find(s=>s.id===id);
    if(!section || passed!==true || !section.missions.every(m=>value.missions[m.id]===true)) fail();
  }
  for(const [id,draft] of Object.entries(value.drafts)) {
    const mission=missions.find(m=>m.id===id);
    if(!mission || !exactKeys(draft,['notes','checks','hints']) || typeof draft.notes!=='string' || draft.notes.length>50000 || !Array.isArray(draft.checks) || draft.checks.length!==mission.checks.length || !draft.checks.every(c=>typeof c==='boolean') || !Number.isInteger(draft.hints) || draft.hints<0 || draft.hints>mission.hints.length) fail();
  }
  return value;
}
function loadProgress(course,storage) {
  try {
    const text=storage.getItem(STORAGE_KEY);
    return {state:text===null ? freshState(course) : parseProgress(course,text),ok:true,message:text===null ? 'Progress stays on this device. Export a backup anytime.' : 'Progress restored from this browser.'};
  } catch {
    return {state:freshState(course),ok:false,message:'Saved progress is unavailable or corrupt. This session still works; import a backup or export before leaving.'};
  }
}
function saveProgress(course,state,storage) {
  try {
    const text=JSON.stringify(state);
    parseProgress(course,text);
    storage.setItem(STORAGE_KEY,text);
    return {ok:true,message:'Saved on this device.'};
  } catch {
    return {ok:false,message:'Not saved on this device. Storage may be blocked or full. Export a backup before leaving.'};
  }
}
function freshState(course) {
  return {schema:1,courseVersion:course.version,missions:{},exams:{},drafts:{},lastMission:null};
}
function allMissions(course) { return course.sections.flatMap(s=>s.missions); }
function completeMission(course,state,id,checks,answers) {
  const mission=allMissions(course).find(m=>m.id===id);
  if(!mission) throw new Error('Unknown mission.');
  const result=grade(mission.quiz,answers);
  if(checks.length!==mission.checks.length || !checks.every(c=>c===true)) return {passed:false,feedback:result.feedback,reason:'Complete every practical self-check in your own Bash terminal first.'};
  if(result.passed) state.missions[id]=true;
  return result;
}
function completeExam(course,state,id,answers) {
  const section=course.sections.find(s=>s.id===id);
  if(!section) throw new Error('Unknown section.');
  if(!section.missions.every(m=>state.missions[m.id]===true)) return {passed:false,feedback:[],reason:'Complete every mission in this section before taking its exam.'};
  const result=grade(section.exam,answers);
  if(result.passed) state.exams[id]=true;
  return result;
}
function completion(course,state) {
  const missions=allMissions(course);
  const done=missions.filter(m=>state.missions[m.id]===true).length+course.sections.filter(s=>state.exams[s.id]===true && s.missions.every(m=>state.missions[m.id]===true)).length;
  const total=missions.length+course.sections.length;
  return {done,total,percent:total ? Math.round(done/total*100) : 0,complete:total>0 && done===total};
}
function resumeTarget(course,state) {
  if(state.lastMission && !state.missions[state.lastMission]) return `#/mission/${encodeURIComponent(state.lastMission)}`;
  for(const section of course.sections) {
    const mission=section.missions.find(m=>!state.missions[m.id]);
    if(mission) return `#/mission/${encodeURIComponent(mission.id)}`;
    if(!state.exams[section.id]) return `#/exam/${encodeURIComponent(section.id)}`;
  }
  return '#/';
}
function grade(questions, answers) {
  const feedback = questions.flatMap((q, i) => answers[i] === q.correct ? [] : [{number:i+1,clue:q.clue}]);
  return {passed:feedback.length === 0,feedback};
}

function announce(text) {document.getElementById('announcer').textContent=text;}

function renderSection(section) {

function draftFor(mission) {

}
function renderMission(section,mission) {

function renderQuiz(questions,assess,nextLink,kind) {
  const section=node('section','','quiz');
  section.append(node('h2',kind==='mission'?'Check your understanding':'Section concept exam'),node('p',`Answer all ${questions.length} questions correctly${kind==='mission'?' and tick every practical self-check':''} to pass. Retries offer clues only — never an answer reveal.`,'muted small'));
  const form=node('form');const groups=[];
  for(const [index,question] of questions.entries()) {
    const group=[];const fieldset=node('fieldset');fieldset.append(node('legend',`${index+1}. ${question.prompt}`));
    for(const [optionIndex,text] of question.options.entries()) {
      const label=node('label','','option');const input=node('input');input.type='radio';input.name=`question-${index}`;input.value=String(optionIndex);
      label.append(input,node('span',text));fieldset.append(label);group.push(input);
    }
    groups.push(group);form.append(fieldset);
  }
  const submit=node('button',kind==='mission'?'Check mission':'Check exam','primary');submit.type='submit';
  const feedback=node('div','','feedback');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');feedback.setAttribute('aria-atomic','true');
  const next=node('div','','next-step');next.hidden=true;

    feedback.replaceChildren();feedback.classList.toggle('passed',result.passed);
    if(result.passed) {
      feedback.append(node('p',kind==='mission'?'Mission complete. Practical work self-attested; concepts passed.':'Section exam passed. Your separate checkpoint is complete.'));

    } else {

      if(result.feedback.length) {const list=node('ul');for(const item of result.feedback)list.append(node('li',`Question ${item.number}: ${item.clue}`,'prose'));feedback.append(list);}
      announce('Not passed yet. Read the retry clues and try again.');
    }
  });
  form.append(submit,feedback,next);section.append(form);main.append(section);
}
function renderExam(section) {
  main.append(link(`← ${section.title}`,`#/section/${encodeURIComponent(section.id)}`,'breadcrumb'));

  }
  if(state.exams[section.id])main.append(node('p','✓ Section exam already passed. You can revisit it without losing your pass.','tag'));
  renderQuiz(section.exam,answers=>completeExam(course,state,section.id,answers),()=>{
    const next=course.sections[course.sections.indexOf(section)+1];
    return link(next?'Next section →':'Return to your trail →',next?`#/section/${encodeURIComponent(next.id)}`:'#/','button primary');

function renderBackup() {
  headline('Your work, your device','Keep a copy of your trail.','No account, no telemetry, no backend. Notes and progress live only in this browser’s local storage. They do not sync between devices.');
  main.append(node('p','Clearing site data, private browsing, changing browsers, moving between file:// and a hosted URL, or opening a different host can lose or separate progress. Export regularly and before switching devices.','note'));
  const feedback=node('p','','feedback');feedback.id='backup-feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
  const panel=node('section','','panel');panel.append(node('h2','Export a backup'),node('p','A JSON file with your passes, self-checks, hints, notes and last mission. Keep it somewhere private.','muted'));
  panel.append(button('Download progress JSON',()=>{
    try {
      const data=JSON.stringify(state,null,2);parseProgress(course,data);
      const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      const download=link('Download',url);download.download='bash-trail-progress.json';document.body.append(download);download.click();download.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      feedback.textContent='Backup download requested. Check your downloads and keep the file safe.';
    } catch {feedback.textContent='The download could not start. Try another browser or allow downloads; your current progress is unchanged.';}
  },'primary'));
  const backupLimit=`${MAX_BACKUP_BYTES/(1024*1024)} MiB`;
  const importing=node('section','','panel');importing.append(node('h2','Import a backup'),node('p',`Import replaces your current progress after confirmation. Only a valid export for this course version is accepted (maximum ${backupLimit}). Export your current work first.`,'muted'));
  const file=node('input');file.id='backup-file';file.type='file';file.accept='.json,application/json';file.className='backup-file';
  const label=node('label','Choose progress JSON');label.htmlFor='backup-file';
  file.addEventListener('change',async()=>{
    const selected=file.files?.[0];if(!selected)return;
    try {
      if(selected.size>MAX_BACKUP_BYTES)throw Error(`Backup is too large. Choose a progress JSON file no larger than ${backupLimit}.`);
      const incoming=parseProgress(course,await selected.text());
      if(!window.confirm('Replace all current progress and notes with this backup? Export your current work first if you want to keep it.')) {feedback.textContent='Import cancelled. Your current progress is unchanged.';return;}
      state=incoming;const result=persist();updateMeter();
      feedback.textContent=result.ok?'Backup imported and saved on this device.':`Backup imported for this session only. ${result.message}`;
      announce(feedback.textContent);
    } catch(error) {
      feedback.textContent=`Import rejected. ${error.message || 'Choose a valid progress JSON file.'} Your current progress is unchanged.`;
    } finally {file.value='';}
  });
  importing.append(label,file);
  const reset=node('section','','work-block');reset.append(node('h2','Start fresh'),node('p','This removes all local passes, practical checks, revealed hints and scratch notes. It cannot be undone without a backup.','muted small'));
  reset.append(button('Reset all local progress',()=>{
    if(!window.confirm('Reset ALL progress and notes on this device? This cannot be undone. Cancel and export a backup first if needed.'))return;
    state=freshState(course);persist();updateMeter();feedback.textContent='Progress reset for this session. Check the storage status below to confirm it saved.';announce('Progress reset.');
  },'secondary danger'));
  main.append(panel,importing,feedback,reset,fold('Privacy and offline use',[
    'The built HTML contains the whole course and app. No fonts, scripts, APIs, analytics or other assets are fetched at runtime.',
    'Official research links open external sites only when you choose to follow them. Your hosting provider may keep ordinary access logs.',
    'The page never runs your shell commands. A checked practical item is your own attestation, not a code execution result.',
    'Opening the standalone HTML offline works. Some browsers restrict local storage for file:// pages; use export if storage is unavailable. Reopening a hosted URL offline is not guaranteed unless you saved the HTML.'
  ]));
}
function renderRoute() {
  let parts;
  try {parts=(location.hash || '#/').slice(1).split('/').filter(Boolean).map(decodeURIComponent);} catch {parts=['missing'];}
  if(parts[0]==='resume') {
    const target=resumeTarget(course,state);location.replace(target);
    parts=target.slice(1).split('/').filter(Boolean).map(decodeURIComponent);
  }
  main.replaceChildren();
  const [kind,id]=parts;
  if(parts.length===0)renderOverview();
  else if(kind==='backup' && parts.length===1)renderBackup();
  else if(kind==='section' && parts.length===2 && course.sections.some(s=>s.id===id))renderSection(course.sections.find(s=>s.id===id));
  else if(kind==='mission' && parts.length===2 && allMissions(course).some(m=>m.id===id)) {
    const section=course.sections.find(s=>s.missions.some(m=>m.id===id));renderMission(section,section.missions.find(m=>m.id===id));
  } else if(kind==='exam' && parts.length===2 && course.sections.some(s=>s.id===id))renderExam(course.sections.find(s=>s.id===id));
  else {headline('A small detour','Page not found','This bookmark does not match a mission or section in this course version.');main.append(link('Return to the course','#/','button primary'));}
  for(const item of document.querySelectorAll('[data-nav]')) {
    const active=item.getAttribute('data-nav')===(kind==='backup'?'backup':kind==='mission'||kind==='exam'?'resume':'course');
    if(active)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current');
  }
  updateMeter();
  const title=Array.from(main.children).find(el=>el.tagName==='H1');
  if(title) {title.tabIndex=-1;title.focus();document.title=`${title.textContent} · Bash Trail`;}
  else main.focus();
  window.scrollTo({top:0,left:0,behavior:'instant'});
}
