<script id="course-data" type="application/json">{"title":"Bash Trail: From First Shell to Safe Python Integration","version":"1.0.0","setup":["Plan several weeks of practice, not instant mastery. Complete the missions in order, repeat failed cases, and keep a learning journal. The minutes on a mission are an initial work-session estimate, not a mastery promise; research and repeated tests take additional time.","Use a Linux environment with Bash 5 or newer and Python 3.10 or newer, plus standard text utilities. Confirm the actual running shell and interpreter versions rather than assuming your terminal application chooses them. No paid packages or third-party Python dependencies are required.","On Windows, use a Linux distribution in WSL or a trusted remote Linux account. Follow Microsoft's WSL installation documentation at https://learn.microsoft.com/en-us/windows/wsl/install if needed; installation may require administrator approval, but course exercises do not.","macOS commonly includes Bash 3.2 and BSD utilities. Use a separately installed Bash 5+ or a Linux environment for consistent results. Associative arrays are unavailable in Bash 3.2, and utility flags can differ. Do not change your system shell merely to complete this course.","A phone can display lessons, hints, and quizzes. Actual practice requires your own Linux terminal or a trusted remote shell, possibly accessed from the phone. This browser is not a Bash interpreter: quiz results do not establish that your programs work.","Choose an absolute, user-owned workspace ending in bash-trail-lab. Create a separate directory for every mission and keep all fixtures, outputs, temporary files, and test evidence there. Keep filenames with spaces exactly as specified. Write your own commands and programs; this curriculum contains contracts and concepts, not solution code.","Fixture notation is data: a displayed \\n means one newline, \\t means one tab, and an empty string means zero bytes unless stated otherwise. Text is UTF-8. Expected text outputs end in one newline unless explicitly described as empty. Where a filename includes \\n, that notation denotes a real newline in the name, not two characters.","For comparisons involving ordering, use the C locale in the test environment. JSON is compared by parsed values, not whitespace or object-key order, unless a mission explicitly requires byte stability. Arrays remain ordered. Record stdout, stderr, and process exit status separately after each run.","For every mission, create test-notes.md listing the fixture, observed stdout, observed stderr, exit status, and pass/fail for each check. Section exams are knowledge checks; rerun the section's practical fixtures before advancing. No browser control can execute or certify these shell checks."],"safety":["Work as an ordinary user with least privilege. Do not use administrator elevation, system directories, real credentials, production data, or another person's files. Back up anything valuable before shell practice.","Never download and execute a script or pipe fetched content into an interpreter. Read official documentation; type and review your own local programs. Do not install a dependency just because an error message or web page suggests it.","Do not use eval, build shell commands from data, or use Python subprocess with shell=True. Pass arguments as distinct values, preserve boundaries, and treat JSON as structured data rather than text to interpolate into shell syntax.","Quote expansions that represent individual paths or arguments. Account for leading hyphens, whitespace, wildcard characters, and newlines. Do not parse a directory listing as a filename protocol. Use end-of-options handling where the target utility supports it.","Preview file operations before applying them. Never perform recursive cleanup on an unchecked or empty path. Cleanup must target only a private directory created by the current run; a dry run must not make application-data changes.","Treat exit status, stdout, and stderr as independent parts of an interface. A nonzero status may mean an expected condition such as no search matches, not necessarily a crash. Capture status before another operation replaces it.","pipefail changes pipeline status but does not roll back side effects. errexit has contextual exceptions and is not a proof of correctness. Validate inputs and handle expected failures explicitly; never describe strict-mode flags as a complete safety system.","Signals and cleanup need tests. Traps cannot handle every termination, including SIGKILL. Debug traces can reveal arguments or secrets; use synthetic data and keep traces separate from machine-readable output.","These exercises are for cooperative, user-owned sandboxes, not hostile multi-user filesystem security. Path checks alone do not eliminate symlink races. Document this boundary rather than promising confinement against concurrent attackers."],"sections":[{"id":"s01","title":"Orientation, help, and a real sandbox","summary":"Learn what a shell does, distinguish tools from terminal windows, navigate a disposable workspace, and collect evidence rather than guessing.","exam":[{"prompt":"Which evidence best establishes the Bash version used for a practice session?","options":["Version information from the running Bash process","The color scheme of the terminal window","The name of the laptop operating system alone","A browser quiz completion badge"],"correct":0,"clue":"Separate the terminal application, the operating system, and the interpreter actually running."},{"prompt":"A file operation is about to use a relative path. What determines its starting location?","options":["The newest directory in the file manager","The process's current working directory","The directory containing the browser page","The home directory in every case"],"correct":1,"clue":"Review the distinction between absolute and relative path resolution."},{"prompt":"You passed every section quiz on a phone. What practical evidence is still missing?","options":["A screenshot of the quiz score","A faster internet connection","Observed runs against the shell fixtures","A subscription to a terminal theme"],"correct":2,"clue":"Recall which environment can actually execute your local programs."}],"missions":[{"id":"s01m01","title":"Identify your tools without changing the machine","minutes":45,"brief":"Start a real Linux shell as an ordinary user. In your chosen bash-trail-lab workspace, create environment.txt with exactly six labeled lines, in this order: platform=, shell=, bash_major=, python=, workspace=, privileged=. Fill platform with Linux, shell with bash, bash_major with the observed major version, python with the observed full Python version number, workspace with your actual absolute workspace path, and privileged with no. Stop and resolve prerequisites if these observations are not true; do not invent values. This is an evidence file, not a portable hardware fingerprint.","deliverables":["environment.txt containing the six observed fields and no credentials or unrelated environment variables.","test-notes.md recording how you distinguished the terminal application from Bash, verified Bash 5+ and Python 3.10+, and confirmed ordinary-user access."],"research":[{"label":"GNU Bash: What is Bash?","url":"https://www.gnu.org/software/bash/manual/html_node/What-is-Bash_003f.html"},{"label":"Python tutorial","url":"https://docs.python.org/3/tutorial/"}],"hints":["Find out which component displays text and which component interprets your input.","Use version and shell-identity information from the running tools, not the terminal's branding.","Collect only the six requested facts. If a prerequisite fails, change the practice environment rather than editing the evidence to look compliant."],"checks":["Read the file back: exactly six nonempty labeled lines in the required order.","Compare recorded versions with fresh observations from the same practice shell.","Confirm the workspace belongs to you and no administrator elevation was used.","Record real observations locally; the browser cannot validate this file."],"quiz":[{"prompt":"Which description fits a terminal emulator?","options":["A guarantee that Bash 5 is installed","A Python package manager","A replacement for file permissions","An interface that exchanges input and output with running programs"],"correct":3,"clue":"Think about the boundary between displaying a session and interpreting shell language."},{"prompt":"A prerequisite version is too old. What is a sound response?","options":["Move to a compatible practice environment and recheck","Change the version number in the evidence file","Run all exercises as administrator","Assume newer documentation applies without checking"],"correct":0,"clue":"Evidence should describe the environment you actually use."}]},{"id":"s01m02","title":"Navigate a small workspace","minutes":45,"brief":"Inside this mission's directory, build a project directory containing notes, data, and outputs subdirectories. Create notes/map.txt with the data HOME BASE followed by a newline, and data/sample.txt with the data red followed by a newline. From notes, reach data using a relative path, then reach outputs using an absolute path. Finish in the project directory. Write route.txt with exactly these four lines of data: project/notes, project/data, project/outputs, project. These are labels for the locations you must actually visit, not literal absolute paths.","deliverables":["The specified directory tree and two fixture files, with no files outside the mission workspace.","route.txt containing the four location labels in order.","test-notes.md containing your observed working directory at each stop and the distinction between the relative and absolute moves."],"research":[{"label":"Bash builtins and directory navigation","url":"https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html"},{"label":"GNU file utilities manual","url":"https://www.gnu.org/software/coreutils/manual/html_node/index.html"}],"hints":["Draw the directory tree before moving around it.","A relative path is interpreted from your current location; an absolute path has a fixed starting point.","Check your location immediately after each move. Do not infer it from what a prompt happens to display."],"checks":["Read both fixture files and verify their exact text and final newline.","Confirm notes, data, and outputs are siblings inside project.","Use recorded observations to prove the second move used an absolute path.","Confirm your final working directory is project and route.txt has four lines."],"quiz":[{"prompt":"Two shells start in different directories and receive the same relative path. What can happen?","options":["Relative paths always refer to home","They can resolve to different locations","Both shells must terminate","The path becomes absolute automatically"],"correct":1,"clue":"Consider what information a relative path leaves implicit."},{"prompt":"Which observation is most useful immediately after changing directory?","options":["The last browser URL","The screen's font size","The shell's actual working directory","The newest filename anywhere in home"],"correct":2,"clue":"Check the process state that controls subsequent relative paths."}]},{"id":"s01m03","title":"Use help and observe status","minutes":60,"brief":"Research the Bash directory-changing builtin and one external file-copy utility without copying a complete tutorial command sequence. Create evidence.txt with four labeled records: builtin_source= followed by the help source consulted, external_source= followed by its manual source, existing_status= followed by the observed status when entering an existing empty directory, and missing_status= followed by the observed status when attempting to enter a nonexistent child named definitely-absent. The existing attempt must succeed; the missing attempt must fail and leave the working directory unchanged. Record the failed attempt's stderr separately in missing.err. Do not require its wording to match another operating system.","deliverables":["evidence.txt with all four records and actual numeric statuses.","missing.err containing the failed operation's diagnostic, plus test-notes.md identifying which researched tool is a builtin and which is external."],"research":[{"label":"Bash-specific builtins and help","url":"https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html"},{"label":"Bash builtin status behavior","url":"https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html"}],"hints":["A builtin's documentation may be available inside Bash even when there is no separate executable.","Observe the status immediately after each operation; later work can replace it.","Compare working directories before and after failure, and capture the diagnostic separately from ordinary output."],"checks":["Verify the success status is zero and the failure status is nonzero, without assuming a specific nonzero value.","Confirm the failed navigation did not change your location.","Confirm missing.err is nonempty and contains no secret environment information.","Use your local evidence, not the quiz result, to decide whether the mission passes."],"quiz":[{"prompt":"Why record an operation's exit status immediately?","options":["Statuses are encrypted after one second","Only failures have statuses","The browser clears them","A later operation can replace the status being observed"],"correct":3,"clue":"Review the lifetime of the shell's most recent status value."},{"prompt":"What does a zero exit status conventionally mean?","options":["The operation reports success","The operation printed no text","The operation used no files","The operation had administrator access"],"correct":0,"clue":"Separate a program's result convention from its output and privileges."}]}]},{"id":"s02","title":"Safe files, quoting, and globs","summary":"Preserve argument boundaries, distinguish patterns from literal names, and preview narrowly scoped file operations.","exam":[{"prompt":"A variable contains the path field notes.txt. What must the caller preserve?","options":["Two arguments, one per word","One argument containing the entire path","Only the first word","An implicit wildcard around both words"],"correct":1,"clue":"Think about argument boundaries rather than the appearance of printed text."},{"prompt":"Why is a displayed directory listing a poor machine protocol for arbitrary names?","options":["All names are ASCII","Directories cannot contain empty files","Names can contain whitespace and newlines","Listing always changes file content"],"correct":2,"clue":"Consider whether line and word boundaries reliably identify file boundaries."},{"prompt":"A utility supports an end-of-options marker. What problem can it help address?","options":["Missing backups","Every symlink race","Invalid file contents","A filename being interpreted as an option"],"correct":3,"clue":"Review how option parsers treat a leading hyphen in an argument."}],"missions":[{"id":"s02m01","title":"Preserve awkward names","minutes":60,"brief":"Create an incoming directory with three regular files: field notes.txt containing alpha\\n, -draft.txt containing beta\\n, and star*.txt containing gamma\\n. Copy each to an archive directory with its name and contents unchanged. Leave incoming untouched. Write inventory.txt as exactly three lines, in this order: -draft.txt, field notes.txt, star*.txt. In this fixture the asterisk is part of the literal filename, not an instruction to match other files.","deliverables":["incoming and archive containing the same three names and byte-identical contents.","inventory.txt with the exact three name lines, and test-notes.md describing how argument and option boundaries were preserved."],"research":[{"label":"Bash quoting","url":"https://www.gnu.org/software/bash/manual/html_node/Quoting.html"},{"label":"ShellCheck: word splitting and globbing","url":"https://www.shellcheck.net/wiki/SC2086"}],"hints":["A space, a leading hyphen, and a wildcard character create different risks.","Decide which text is a literal path before you let the shell expand anything.","Check both the shell's argument boundaries and the receiving utility's option parsing; fixing one does not automatically fix the other."],"checks":["Count three regular files in each directory and compare each pair by bytes.","Confirm there is no accidental file named field or notes.txt.","Confirm the name star*.txt retains its literal asterisk.","Repeat with archive empty again, without changing or deleting incoming."],"quiz":[{"prompt":"What is the intended meaning of star*.txt in this fixture?","options":["One literal filename","Every text file in the workspace","A request to delete matching files","Two arguments separated at the asterisk"],"correct":0,"clue":"Read the fixture contract before choosing expansion behavior."},{"prompt":"Why can quoting alone be insufficient for a path beginning with a hyphen?","options":["Quoting removes all hyphens","The receiving program may still interpret an argument as an option","Quoted arguments cannot name files","Only Python can open such a path"],"correct":1,"clue":"The shell and the called program perform different kinds of parsing."}]},{"id":"s02m02","title":"Compare glob policies","minutes":60,"brief":"Build cases/populated with a.txt, b.txt, .hidden.txt, and memo.md, all empty; build cases/empty with no files. For each directory, investigate a pattern selecting non-hidden names ending in .txt under default Bash settings and under nullglob. Do not treat the resulting words as real files until you understand them. Create observations.txt with four lines: populated-default=2, populated-nullglob=2, empty-default=1-literal-pattern, empty-nullglob=0. Record the observed argument values in test-notes.md. Start a fresh shell or restore the original option state afterward.","deliverables":["The two fixture directories and observations.txt with the four exact records.","test-notes.md explaining why .hidden.txt is excluded and why the unmatched pattern case must not trigger a file operation."],"research":[{"label":"Bash filename expansion","url":"https://www.gnu.org/software/bash/manual/html_node/Filename-Expansion.html"}],"hints":["A pattern can produce zero, one, or multiple words depending on shell policy.","Investigate the treatment of leading dots separately from the treatment of no matches.","Inspect the expanded argument count before any copy or removal. Compare shell option state before and after the experiment."],"checks":["Observe two matches, not three, in populated under both requested policies.","Observe a retained literal pattern under default no-match behavior.","Observe zero arguments under nullglob in empty.","Confirm no fixture was modified and no option change leaked into later practice."],"quiz":[{"prompt":"Under default Bash settings, what can an unmatched filename pattern become?","options":["A fatal error in all contexts","Every hidden file","The unchanged pattern word","The parent directory"],"correct":2,"clue":"Compare the documented default no-match policy with optional policies."},{"prompt":"Why explicitly restore a shell option after an experiment?","options":["Options are saved inside every text file","It makes filenames shorter","It installs Bash updates","Later operations may depend on a different expansion policy"],"correct":3,"clue":"Think about state that survives from one interactive operation to the next."}]},{"id":"s02m03","title":"Preview a reversible archive","minutes":75,"brief":"Create inbox with old report.txt containing OLD\\n, keep.txt containing KEEP\\n, and .private.txt containing PRIVATE\\n. Your task is a manual, reviewed archive operation, not yet a script: select only old report.txt, record preview.txt as the single line MOVE old report.txt -> archive/old report.txt, then move that one file into archive. Restore it to inbox afterward. No deletion is allowed. If archive/old report.txt already exists, stop rather than overwrite it. Run the collision case with destination content EXISTING\\n and preserve both originals.","deliverables":["preview.txt, an archive directory, and the restored three-file inbox.","test-notes.md recording the normal move, restoration, collision refusal, and byte comparisons."],"research":[{"label":"GNU file operations","url":"https://www.gnu.org/software/coreutils/manual/html_node/index.html"},{"label":"Bash quoting","url":"https://www.gnu.org/software/bash/manual/html_node/Quoting.html"}],"hints":["Choose an exact source and exact destination before performing the operation.","A preview is useful only if it describes the same scope you later apply.","Check collision behavior before moving anything; a convenient default is not necessarily your intended overwrite policy."],"checks":["After restoration, all three inbox files have their original names and contents.","The normal operation changed only the selected file's location.","The collision test preserved both OLD and EXISTING contents and was recorded as refused.","No recursive deletion, administrator access, or operation outside the mission directory occurred."],"quiz":[{"prompt":"What should happen when this mission's destination already exists?","options":["Refuse the move and preserve both files","Overwrite it silently","Delete the whole archive","Merge both byte streams automatically"],"correct":0,"clue":"Review the operation's collision contract, not just a tool's default behavior."},{"prompt":"Which makes a preview useful as a safety step?","options":["It contains a motivational message","It accurately describes the exact operation and target scope","It runs after the irreversible action","It hides filenames with spaces"],"correct":1,"clue":"Compare what was reviewed with what will actually change."}]}]},{"id":"s03","title":"Streams, pipelines, search, and text","summary":"Build explicit text contracts, handle no-match search outcomes, and understand what pipeline status does and does not tell you.","exam":[{"prompt":"Which interface is appropriate for a machine-readable report and human diagnostics?","options":["Mix both indiscriminately on stdout","Write diagnostics inside every data field","Keep report data on stdout and diagnostics on stderr","Discard all failure information"],"correct":2,"clue":"Think about the consumer that expects only the report format."},{"prompt":"What does enabling pipefail fail to provide?","options":["A change to pipeline status rules","Visibility of some earlier pipeline failures","A nonzero result for an earlier failing stage when applicable","Automatic rollback of files already written"],"correct":3,"clue":"Separate reporting a failure from undoing side effects."},{"prompt":"A search utility documents status 1 as no matches and status 2 as an error. What should a caller do?","options":["Distinguish the documented outcomes explicitly","Treat both as successful matches","Assume all nonzero statuses mean missing software","Ignore status whenever stdout is empty"],"correct":0,"clue":"The meaning of a nonzero value belongs to the particular tool's contract."}],"missions":[{"id":"s03m01","title":"Separate records from diagnostics","minutes":60,"brief":"Prepare records.txt containing oak\\npine\\n and leave missing.txt absent. Perform a single file-reading operation with records.txt first and missing.txt second, capturing stdout in records.out and stderr in records.err. Expected stdout is exactly oak\\npine\\n even though the overall operation fails. Expected stderr is nonempty and refers to missing.txt; its exact prose is not fixed. Repeat using records.txt alone: identical stdout, empty stderr, zero status. Do not merge streams.","deliverables":["records.txt, records.out, records.err, and separate evidence for the successful rerun.","test-notes.md showing stdout, stderr, and status independently for both cases."],"research":[{"label":"Bash redirections","url":"https://www.gnu.org/software/bash/manual/html_node/Redirections.html"},{"label":"GNU file-reading tools","url":"https://www.gnu.org/software/coreutils/manual/html_node/index.html"}],"hints":["A program can produce useful output and still report a failure.","Identify the standard stream intended for ordinary data and the one intended for diagnostics.","Capture the streams separately from the start; trying to separate merged text afterward loses information."],"checks":["Compare records.out byte-for-byte with the two fixture lines.","Confirm the mixed existing/missing case has nonzero status and a nonempty diagnostic stream.","Confirm the existing-only case has zero status and empty stderr.","Keep diagnostics out of records.out in both cases."],"quiz":[{"prompt":"Can a failing file-reading operation have useful stdout?","options":["No, failure erases all output","Yes, earlier inputs may already have been read","Only with administrator privileges","Only if stderr is empty"],"correct":1,"clue":"Think about processing multiple inputs in order."},{"prompt":"Why not mix stderr into records.out here?","options":["stderr cannot contain text","Redirection changes file permissions automatically","The consumer expects only fixture records","Nonzero status prevents redirection"],"correct":2,"clue":"Revisit the contract for the output file's contents."}]},{"id":"s03m02","title":"Search literal text and count outcomes","minutes":75,"brief":"Create events.txt with these five lines: INFO boot, WARN disk.full, INFO diskXfull, WARN disk.full, ERROR stop. Find lines containing the literal text disk.full, then produce summary.txt containing exactly 2 WARN disk.full followed by a newline; the leading 2 is a count, with exactly one space before WARN. No regular-expression interpretation of the dot is allowed. Also test the literal text absent: produce an empty match file and record the documented no-match status. Test a nonexistent input separately and record an error status, not a no-match result.","deliverables":["events.txt, matches.txt containing exactly the two WARN disk.full lines, and summary.txt with the one normalized count line.","test-notes.md recording matched, no-match, and missing-input outcomes as three distinct cases."],"research":[{"label":"GNU grep: matching and exit status","url":"https://www.gnu.org/software/grep/manual/grep.html"},{"label":"GNU text utilities","url":"https://www.gnu.org/software/coreutils/manual/html_node/index.html"}],"hints":["Decide whether the search term is a literal string or a pattern language.","Count duplicate complete lines after selection, and normalize formatting deliberately.","Inspect the search tool's own status before adding more pipeline stages that could hide it."],"checks":["The INFO diskXfull line never appears in matches.txt.","summary.txt is exactly one line with count 2 and no padding before it.","The absent-text case has empty matches and the documented no-match status.","The missing-input case has a diagnostic and an error status, distinguished from no matches."],"quiz":[{"prompt":"Why can disk.full match diskXfull in a pattern-based search?","options":["The input file changes automatically","Whitespace is always ignored","Search tools reverse strings","A dot can have special meaning in the pattern language"],"correct":3,"clue":"Compare literal search with regular-expression metacharacters."},{"prompt":"What should the absent-text test prove?","options":["No matches is distinguished from an input error","Every empty output is a crash","The input must be deleted","Diagnostics belong in the match file"],"correct":0,"clue":"Review the search utility's documented outcome categories."}]},{"id":"s03m03","title":"Audit pipeline status and text assumptions","minutes":90,"brief":"Create scores.tsv with four tab-separated records, no header: amy\\t7, bo\\t2, amy\\t5, cy\\t2. Produce ranked.tsv with exactly amy\\t12, bo\\t2, cy\\t2 on separate lines, sorted by descending numeric total then ascending name under the C locale. This fixture has simple single-word names; do not claim it is a general CSV parser. Separately investigate a two-stage pipeline whose first stage reads an absent file and whose second stage counts input lines successfully. Record pipeline status with pipefail disabled and enabled, plus the two individual stage statuses captured immediately. Show that a created output file can still exist after pipeline failure.","deliverables":["scores.tsv and ranked.tsv with the exact totals and ordering.","pipeline-notes.txt containing both option states, both stage-status pairs, overall statuses, and whether the counting output file exists.","test-notes.md explaining why pipeline success is not equivalent to every stage succeeding."],"research":[{"label":"Bash pipelines","url":"https://www.gnu.org/software/bash/manual/html_node/Pipelines.html"},{"label":"Bash set options","url":"https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html"}],"hints":["Separate record parsing, accumulation, and final ordering into distinct responsibilities.","Use numeric ordering for totals and an explicit secondary key for ties.","Pipeline status and per-stage status are different observations. Capture them before another operation changes the evidence; neither observation reverses redirection side effects."],"checks":["amy totals 12; bo and cy tie at 2 and appear in name order.","Tabs remain delimiters in ranked.tsv, with no decorative headings.","The failing first stage is visible in the stage statuses under both policies.","Record a successful final stage, changed overall pipeline status under pipefail, and an output file that was not rolled back.","Restore the original shell option state after the experiment."],"quiz":[{"prompt":"Without pipefail, which stage normally determines a foreground pipeline's status?","options":["The stage with the longest name","The last stage","The first stage unconditionally","The stage that printed the most bytes"],"correct":1,"clue":"Review the default pipeline status rule separately from per-stage observations."},{"prompt":"Why specify a secondary sort key?","options":["It makes text numeric","It removes all duplicates","It makes equal-total ordering reproducible","It repairs malformed input automatically"],"correct":2,"clue":"Think about the two records whose totals are equal."}]}]},{"id":"s04","title":"Scripts, arguments, and decisions","summary":"Define small command-line interfaces with explicit validation, documented statuses, and predictable stdout and stderr.","exam":[{"prompt":"What distinguishes an omitted argument from an explicitly empty argument?","options":["They always have identical argument counts","An empty argument is removed by the operating system","Only filenames can be empty","An empty argument still occupies an argument position"],"correct":3,"clue":"Separate the number of argument values from the length of each value."},{"prompt":"When should a script validate an output-affecting argument?","options":["Before making application-data changes","Only after writing all output files","Only when stdout is a terminal","Never if it has a shebang"],"correct":0,"clue":"Consider what can still be avoided before a side effect occurs."},{"prompt":"What does a shebang primarily identify when a script is executed directly?","options":["The script author's username","The interpreter to use","The directory to delete on failure","The expected quiz score"],"correct":1,"clue":"Distinguish how a script starts from what its body does."}],"missions":[{"id":"s04m01","title":"Build a one-argument greeting interface","minutes":75,"brief":"Write greet.sh for Bash. Exactly one nonempty argument is accepted as a display name; spaces inside it must be preserved. For the data argument Ada Lovelace, stdout is exactly Hello, Ada Lovelace! followed by a newline, stderr is empty, and status is 0. Zero arguments, two arguments, and one empty argument each produce empty stdout, exactly usage: greet.sh NAME on stderr, and status 2. A name consisting of two spaces is nonempty and must be preserved. Do not interpret the name as shell syntax.","deliverables":["greet.sh with an intentional Bash interpreter declaration and argument validation.","test-notes.md covering the valid spaced name, missing argument, extra argument, empty argument, and two-space argument."],"research":[{"label":"Bash shell parameters","url":"https://www.gnu.org/software/bash/manual/html_node/Shell-Parameters.html"},{"label":"Bash conditional constructs","url":"https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html"}],"hints":["Define arity and content validation as separate questions.","Test the number of supplied arguments before reading a required value.","Keep the greeting as data formatting, not constructed shell source; send the fixed usage message to the diagnostic stream."],"checks":["The Ada Lovelace test has one greeting line and empty stderr.","All three invalid-usage cases have status 2 and no stdout.","A two-space name is accepted without trimming or splitting.","Run through Bash and by direct execution in the intended environment; record interpreter and permission differences."],"quiz":[{"prompt":"Why test argument count before using a required positional value?","options":["It makes names uppercase","It prevents all filesystem races","The required position may not have been supplied","It eliminates the need for output formatting"],"correct":2,"clue":"Consider the zero-argument invocation first."},{"prompt":"How should the display name Ada Lovelace reach the script?","options":["As two required arguments","As a filename glob","As text to evaluate","As one argument preserving the embedded space"],"correct":3,"clue":"Compare the interface's arity with the name's characters."}]},{"id":"s04m02","title":"Validate a numeric decision","minutes":90,"brief":"Write classify.sh accepting exactly one ASCII decimal integer from 0 through 100. Only the spelling 0 or a nonzero digit followed by digits is allowed: reject signs, whitespace, leading zeroes such as 07, decimals, and non-ASCII digits. For 0 through 49 output retry; for 50 through 79 output practice; for 80 through 100 output ready. Each accepted case has one stdout line, empty stderr, and status 0. All invalid cases have empty stdout, stderr exactly error: expected integer 0..100, and status 2. Extremely long digit strings must be rejected without arithmetic overflow or shell arithmetic diagnostics.","deliverables":["classify.sh implementing the documented range and spelling contract.","test-notes.md covering 0, 49, 50, 79, 80, 100, 101, 07, -1, an empty argument, 3.5, and a 200-digit integer."],"research":[{"label":"Bash conditional constructs","url":"https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html"},{"label":"Bash parameters","url":"https://www.gnu.org/software/bash/manual/html_node/Shell-Parameters.html"}],"hints":["Distinguish valid spelling, safe numeric size, and classification boundaries.","Reject impossible lengths and spellings before asking arithmetic to interpret the value.","Build tests on both sides of every boundary; a valid example in the middle does not establish the edge behavior."],"checks":["All six boundary values produce the required category and zero status.","Invalid spellings and oversized values produce only the fixed diagnostic on stderr.","No raw arithmetic error leaks into output for the 200-digit case.","The script accepts only the documented ASCII representation, not alternate numeric notations."],"quiz":[{"prompt":"What should precede numeric comparison of untrusted numeric text?","options":["Validation of spelling and a safe size/range","Evaluation as shell source","Removal of every nondigit without reporting it","An automatic administrator retry"],"correct":0,"clue":"Consider both malformed text and a very long string of digits."},{"prompt":"Which test strategy best targets off-by-one errors here?","options":["Testing 60 repeatedly","Testing values on both sides of each category boundary","Testing only empty input","Ignoring 0 and 100"],"correct":1,"clue":"Look at where the category definition changes."}]},{"id":"s04m03","title":"Classify filesystem inputs honestly","minutes":90,"brief":"Write inspect.sh accepting exactly one path. Report a readable regular nonsymlink file as file on stdout with status 0, and a directory that is not a symlink as directory on stdout with status 0. Symlinks, including broken ones, are rejected with stderr error: symlink not supported and status 3. An absent path yields error: path not found and status 3; other filesystem objects yield error: unsupported path and status 3; an unreadable regular file yields error: file not readable and status 3. Usage errors yield usage: inspect.sh PATH and status 2. Every failure has empty stdout. Fixture: sample file.txt containing x\\n, an empty dir named empty dir, and symlinks file-link and broken-link pointing to the fixture file and an absent target respectively. Never modify the inspected input.","deliverables":["inspect.sh and the fixture tree.","test-notes.md covering each supported kind, both symlinks, a missing path, wrong arity, and an unreadable file where ordinary-user permissions make that test meaningful."],"research":[{"label":"Bash conditional file tests","url":"https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html"}],"hints":["File predicates can follow symlinks; the order of your decisions matters.","Distinguish a link object from the kind of object its target happens to be.","Test the rejection rule for links before classification rules that follow targets. Record an unavailable permission test as skipped, not passed."],"checks":["The spaced file and directory names are each passed as one path.","Both working and broken symlinks receive the same explicit rejection.","All failures have empty stdout, the specified diagnostic, and the specified status.","Byte contents, directory entries, and link targets are unchanged.","Permission tests are performed as an ordinary user; do not claim an unreadable case passed under elevated access."],"quiz":[{"prompt":"Why check a symlink-specific rejection before a regular-file classification?","options":["All symlinks are directories","Checking a file always deletes its link","Some file predicates follow the link to its target","Broken links have no names"],"correct":2,"clue":"Review whether a predicate describes the link itself or the referenced object."},{"prompt":"A permission fixture remains readable because the test was elevated. How should the result be recorded?","options":["Passed because no error appeared","Passed after changing expected output","Ignored without a note","Not meaningfully exercised; rerun unprivileged or mark skipped"],"correct":3,"clue":"Test evidence must establish the precondition it claims to test."}]}]},{"id":"s05","title":"Loops, functions, and arrays","summary":"Process records without losing data, isolate reusable behavior, and represent lists as lists rather than fragile strings.","exam":[{"prompt":"Which representation best preserves an ordered list of Bash arguments containing spaces?","options":["An array with one element per argument","A single space-joined string","A directory listing copied into a variable","A string intended for eval"],"correct":0,"clue":"Consider whether item boundaries survive without reparsing text."},{"prompt":"A line-processing loop must handle a final line without a newline. What must its tests include?","options":["Only files ending in two newlines","A nonempty final record without its delimiter","Only empty directories","Only filenames without spaces"],"correct":1,"clue":"Think about data that exists even when the final read does not see a delimiter."},{"prompt":"Why keep scratch variables local to a function?","options":["It makes all errors fatal","It hides stderr","It reduces accidental changes to caller state","It makes the function run in another machine"],"correct":2,"clue":"Review the boundary between reusable behavior and surrounding shell state."}],"missions":[{"id":"s05m01","title":"Read records without eating characters","minutes":90,"brief":"Write number-lines.sh accepting one readable text-file path. For each input record, output its 1-based number, a tab, and the original record unchanged. Fixture lines are alpha, an empty line, two spaces followed by beta followed by two spaces, a record consisting of capital C then a colon then one literal backslash then notes, and omega. The first four records end in newlines; omega does not. Expected output contains five newline-terminated records, including 2 followed only by a tab and newline for the empty record. An empty file yields empty stdout and status 0. Missing/unreadable input yields empty stdout, stderr error: cannot read input, status 3; wrong arity yields usage: number-lines.sh FILE, status 2. This is a line protocol: embedded NUL bytes are out of scope.","deliverables":["number-lines.sh, records.txt with the specified final-line condition, and numbered.tsv.","test-notes.md with byte-aware comparisons for whitespace, backslash, empty-file, and missing-input cases."],"research":[{"label":"Bash read builtin","url":"https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html"},{"label":"Bash looping constructs","url":"https://www.gnu.org/software/bash/manual/html_node/Looping-Constructs.html"}],"hints":["Reading lines is not the same as splitting words.","Look for read behavior controlling trimming and backslash interpretation.","Account for a final nonempty record when the delimiter is absent, and keep any loop counters in the scope where you need them."],"checks":["Exactly five records appear, including the empty second record.","Leading/trailing spaces and the backslash survive unchanged.","omega appears despite the missing final input newline.","An empty input produces zero bytes, not a numbered empty record.","Missing input is distinguished from a legitimately empty input."],"quiz":[{"prompt":"What would word splitting lose from this fixture?","options":["The ability to count integers","The filesystem's owner","The script's interpreter version","Empty records and significant whitespace boundaries"],"correct":3,"clue":"Compare records with words, especially the second and third input records."},{"prompt":"Why test the final record without a newline?","options":["A loop can otherwise discard valid trailing data","Text files can never end that way","It makes backslashes into tabs","It proves all binary input is supported"],"correct":0,"clue":"Separate reaching end-of-file from receiving no data at all."}]},{"id":"s05m02","title":"Refactor a classifier into functions","minutes":105,"brief":"Create size-report.sh using a function that accepts a validated byte count from 0 through 9999 and classifies it: zero is empty, 1..9 is small, and 10..9999 is large. The top-level CLI accepts zero or more canonical decimal counts under the spelling rules from section 4. Validate every argument before emitting anything. For the argument sequence 0, 9, 10, stdout is exactly 0\\tempty\\n9\\tsmall\\n10\\tlarge\\n. No arguments is a successful empty batch. Any invalid argument, including 10000, causes empty stdout, stderr error: invalid count, and status 2. Function scratch state must not alter a caller variable named category whose initial value is unchanged; document a local test of that scope boundary.","deliverables":["size-report.sh with separate validation, classification, and top-level reporting responsibilities.","test-notes.md covering the sample batch, zero arguments, boundary 9999, a mixed valid/invalid batch, and the caller-state test."],"research":[{"label":"Bash shell functions","url":"https://www.gnu.org/software/bash/manual/html_node/Shell-Functions.html"},{"label":"Bash local variables","url":"https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html"}],"hints":["Choose function inputs and outputs before moving code into functions.","Validation for a whole batch may need to finish before reporting the first item.","Use function-local scratch state and distinguish a function's data output from its exit status; do not confuse return status with an arbitrary numeric result."],"checks":["The sample batch produces exactly the three requested tab-separated records.","A mixed batch such as 9, bad, 10 produces no partial stdout.","0, 9, 10, and 9999 exercise every category and upper boundary.","The caller's category value remains unchanged in the documented scope test.","Functions have explicit contracts and do not silently depend on unrelated global variables."],"quiz":[{"prompt":"Why validate the entire batch before printing its first record?","options":["It makes numbers sort automatically","The contract forbids partial stdout for invalid batches","Functions cannot print more than once","It guarantees the disk cannot fill"],"correct":1,"clue":"Review the mixed valid/invalid batch's required output."},{"prompt":"What should carry an ordinary classification label from a function under a documented stream interface?","options":["A filename chosen by guessing","An unlimited integer return status","The function's designated data output","A modification of every caller variable"],"correct":2,"clue":"Separate textual results, success/failure status, and shared state."}]},{"id":"s05m03","title":"Preserve a batch as an array","minutes":105,"brief":"Write lengths.sh accepting zero or more arguments and outputting one line per argument: 1-based index, tab, character count. Set the fixture locale to C and use ASCII values only. For four arguments alpha, two words, an empty string, and star*.txt, expected stdout is 1\\t5\\n2\\t9\\n3\\t0\\n4\\t9\\n. No arguments yields no output and status 0. Store and forward the argument list through an indexed array before reporting; no rejoining and reparsing, eval, or filesystem glob expansion is allowed. Add a fifth fixture argument containing a real newline between a and b; it has length 3 and still produces just the count record, not an echoed filename.","deliverables":["lengths.sh using an indexed array as the batch representation.","test-notes.md proving order, empty-element retention, literal wildcard retention, and newline-containing argument handling."],"research":[{"label":"Bash arrays","url":"https://www.gnu.org/software/bash/manual/html_node/Arrays.html"},{"label":"ShellCheck: splitting and globbing","url":"https://www.shellcheck.net/wiki/SC2086"}],"hints":["Represent each input argument as an element, including the empty one.","Array expansion has forms that preserve elements and forms that can collapse or split them.","Test after forwarding through another function boundary; preserving the original call is not enough if a later expansion loses boundaries."],"checks":["The four-argument fixture produces exactly four ordered records with counts 5, 9, 0, 9.","Creating other files matching the wildcard does not change the output.","The newline-containing fifth argument produces a single count record with value 3.","No-argument input remains an empty list, not one empty element.","Review every argument-forwarding point for preserved array boundaries."],"quiz":[{"prompt":"What happens when an argument list is joined with spaces and later split again?","options":["Empty arguments are guaranteed to survive","Newlines become impossible","All filenames become safe automatically","Original element boundaries can be lost"],"correct":3,"clue":"Try distinguishing one spaced element from two separate elements using only the joined text."},{"prompt":"Why include an empty element in the array fixture?","options":["It detects implementations that silently drop an argument","It tests administrator permissions","It requests an empty directory","It forces every result to be zero"],"correct":0,"clue":"A list can contain a value whose length is zero without being an empty list."}]}]},{"id":"s06","title":"Safety, cleanup, processes, debugging, and tests","summary":"Treat failure paths as first-class behavior. Add scoped cleanup, explicit process ownership, and repeatable practical tests without trusting strict-mode slogans.","exam":[{"prompt":"What is the safest cleanup target for a temporary workspace?","options":["Any directory whose name contains temp","The exact private directory created and recorded by the current run","Whatever path an empty variable happens to imply","The parent of the current working directory"],"correct":1,"clue":"Consider ownership, provenance, and the smallest possible scope."},{"prompt":"Why is errexit alone insufficient as an error-handling design?","options":["It automatically repairs bad data","It prevents signals","Its behavior depends on syntactic context and does not implement recovery","It makes stderr unavailable"],"correct":2,"clue":"Review conditional contexts and the difference between stopping and recovering."},{"prompt":"Which termination cannot be handled by a user-installed cleanup trap?","options":["An ordinary validation failure","A catchable termination request","Normal script completion","SIGKILL"],"correct":3,"clue":"Not every signal permits the process to run more code."}],"missions":[{"id":"s06m01","title":"Create and clean only your own workspace","minutes":120,"brief":"Write staged-report.sh accepting --mode followed by ok, fail, or wait, then --temp-parent followed by a user-owned existing directory. Each run creates one private child directory under that parent and a scratch file inside it. Before work, report exactly one stderr line temp= followed by the child's absolute path. In ok mode output ready on stdout and exit 0; in fail mode leave stdout empty, add stderr error: staged failure, and exit 4. In wait mode remain idle after reporting the path until sent TERM; then leave stdout empty and exit 143. Remove only this run's private directory on all three paths. Invalid arguments have status 2 and must create nothing. A preexisting sibling directory named keep me containing sentinel.txt must survive unchanged.","deliverables":["staged-report.sh with explicit validation and scoped cleanup.","test-notes.md for ok, fail, invalid usage, and TERM during wait, including before/after directory inventories and captured statuses."],"research":[{"label":"Bash traps and exit","url":"https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html"},{"label":"Bash signal behavior","url":"https://www.gnu.org/software/bash/manual/html_node/Signals.html"}],"hints":["Allocate a fresh private directory and remember its exact identity before creating scratch data.","Cleanup should tolerate being requested more than once while preserving the intended exit status.","Install handlers deliberately for the stated modes, verify the recorded path before cleanup, and document that forced uncatchable termination can leave artifacts."],"checks":["Each reported temporary directory is unique, private, and absent after its run finishes.","The sibling keep me directory and sentinel bytes are unchanged in every test.","The three modes have their specified stdout, diagnostics, and statuses.","Invalid arguments create no child directories.","State plainly that the trap cannot guarantee cleanup after SIGKILL or machine failure."],"quiz":[{"prompt":"Why retain the original failure status during cleanup?","options":["Cleanup success must not disguise the job's failure","Every trap must exit zero","Status values are filenames","It makes SIGKILL catchable"],"correct":0,"clue":"Consider what the parent process needs to know after cleanup finishes."},{"prompt":"Why test with an unrelated sibling sentinel?","options":["To make the test require administrator access","To detect cleanup that exceeds its owned scope","To ensure all siblings are deleted","To increase temporary-file size"],"correct":1,"clue":"The safety claim includes what must remain untouched."}]},{"id":"s06m02","title":"Own and reap a background child","minutes":120,"brief":"Write supervise.sh accepting --mode ok or fail, or --mode wait. Launch exactly one child that performs only a bounded synthetic delay: ok and fail delay about one second, then finish with status 0 and 7 respectively; wait delays at most 60 seconds. Store the actual launched child's PID and wait for that child. ok yields stdout child=ok and status 0; fail yields empty stdout, stderr error: child failed, and status 7. If the supervisor receives TERM in wait mode, terminate and reap only its own child, leave stdout empty, report stderr error: interrupted, and exit 143. Do not use process-name matching or system-wide termination. Wrong usage exits 2 before launching a child.","deliverables":["supervise.sh with explicit child ownership and wait handling.","test-notes.md recording the parent/child PIDs, observed statuses, TERM timing, and proof the recorded child is no longer running.","A short limitation note about direct-child ownership rather than claiming to manage arbitrary grandchildren."],"research":[{"label":"Bash wait and job builtins","url":"https://www.gnu.org/software/bash/manual/html_node/Job-Control-Builtins.html"},{"label":"Bash signals","url":"https://www.gnu.org/software/bash/manual/html_node/Signals.html"}],"hints":["A background launch does not mean its work has finished successfully.","Record the PID at launch and distinguish launch status from the eventual wait result.","Keep the ownership boundary to the one direct child. Test interruption during the delay and verify reaping, not merely that a termination request was sent."],"checks":["Successful and failing children produce the specified parent status and stream contract.","TERM during wait ends the child and the parent within a reasonable local test deadline, such as five seconds.","An unrelated process you started for comparison remains alive until you stop it separately.","Wrong usage launches no child.","No broad process-name kill, elevated access, or claim of arbitrary process-tree control appears."],"quiz":[{"prompt":"What establishes the eventual outcome of a launched background child?","options":["The launch returning immediately","A browser animation","Waiting for the recorded child and examining its result","The child's executable name alone"],"correct":2,"clue":"Separate starting a process from observing its completion."},{"prompt":"Why avoid terminating every process with the child's name?","options":["Names are always secret","Named processes cannot exit","It makes waiting impossible on Linux","Unrelated processes can share the same name"],"correct":3,"clue":"The task grants ownership of one launched child, not all similar programs."}]},{"id":"s06m03","title":"Build a regression harness and debug with evidence","minutes":150,"brief":"Write test-course.sh to run at least eight named cases against your existing classify.sh, lengths.sh, and staged-report.sh. Include a classification boundary, invalid long integer, empty argument, spaced argument, literal wildcard, empty batch, deliberate staged failure, and scoped cleanup. Compare stdout, stderr, and status for every case, allowing the documented dynamic temp path only where appropriate. Print PASS followed by a tab and case name for each passing case; print FAIL followed by a tab and case name for each failing case. Exit 0 only if all pass, otherwise 1. Harness configuration errors exit 2 with diagnostics on stderr. Prove detection by temporarily making a disposable copy of classify.sh misclassify 50, pointing the harness to that copy, and observing a failed case. Do not modify your original artifact.","deliverables":["test-course.sh, named expected fixtures, and an all-pass transcript from the real scripts.","A separate transcript where the deliberately broken copy causes status 1 and a FAIL record.","debug-notes.md with one trace-based observation, one static-review finding or clean result, and why neither tracing nor a clean linter proves correctness."],"research":[{"label":"Bash set: errexit, pipefail, tracing","url":"https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html"},{"label":"ShellCheck quoting diagnostic","url":"https://www.shellcheck.net/wiki/SC2086"}],"hints":["A test case needs expected data, expected diagnostics, and expected status, not just a label.","An expected nonzero result should be captured by the harness rather than aborting it accidentally.","Use a synthetic defect to test the test. Keep trace output separate, and review errexit exceptions instead of assuming a flag handles expected failures for you."],"checks":["At least eight named cases run to completion against the original artifacts with status 0.","The deliberate broken copy produces at least one FAIL and harness status 1.","A missing configured program produces harness status 2, not an all-pass report.","Trace output does not contaminate compared stdout and contains only synthetic data.","If ShellCheck is unavailable, record that limitation and perform manual review; do not invent a clean tool result."],"quiz":[{"prompt":"Why intentionally introduce a defect in a disposable copy?","options":["To verify the harness can detect a real mismatch","To replace the original with weaker behavior","To avoid comparing stderr","To guarantee all tests pass"],"correct":0,"clue":"A test suite also makes claims that need evidence."},{"prompt":"What risk does shell execution tracing introduce?","options":["It silently repairs argument boundaries","It can expose argument values or secrets in diagnostic output","It proves every branch correct","It prevents all nonzero statuses"],"correct":1,"clue":"Consider what expanded values a debugging trace may reveal."}]}]},{"id":"s07","title":"Python foundations, CLI design, environments, and JSON","summary":"Learn Python's data model and error handling before integrating interpreters. Use explicit command-line interfaces and structured serialization.","exam":[{"prompt":"A Python program receives two words as one command-line value. Where should that boundary be preserved?","options":["Only in a human-readable log","By rejoining all argv values and splitting later","In the argument sequence from caller through parser","By interpreting the value as Python source"],"correct":2,"clue":"Apply the same argument-boundary reasoning used with Bash arrays."},{"prompt":"What does a Python virtual environment primarily isolate?","options":["All operating-system permissions","Every child process from the filesystem","Network traffic from the machine","A project's interpreter environment and installed Python packages"],"correct":3,"clue":"Distinguish dependency isolation from a security sandbox."},{"prompt":"Why serialize JSON with a JSON library?","options":["It handles structured types and string escaping consistently","It turns data into trusted shell commands","It eliminates all schema validation","It makes all paths safe to delete"],"correct":0,"clue":"Think about quotes, backslashes, newlines, booleans, and arrays."}],"missions":[{"id":"s07m01","title":"Learn Python values with a small text analyzer","minutes":150,"brief":"First study Python strings, integers, lists, dictionaries, loops, functions, imports, file context managers, and exceptions. Then write analyze.py accepting exactly one UTF-8 text-file path from the argument sequence. Input has one word per record; ignore blank records and preserve case. Fixture words.txt contains pear\\napple\\npear\\n\\nApple\\n. Output exactly records=4\\nunique=3\\n, with status 0 and empty stderr. An empty file outputs records=0\\nunique=0\\n. A final word without a newline still counts. Wrong arity yields usage: analyze.py FILE and status 2; unreadable/missing input or invalid UTF-8 yields error: cannot read UTF-8 input and status 3. All failures have empty stdout. Do not use eval, execute input text, or call the shell.","deliverables":["analyze.py using a main function, a counting function, and narrow error handling for the documented failures.","words.txt and test-notes.md covering the fixture, empty file, missing final newline, missing path, invalid UTF-8, and wrong arity.","A brief learning note explaining the roles of a list, a set or dictionary, a function result, and an exception."],"research":[{"label":"Python tutorial: core language and exceptions","url":"https://docs.python.org/3/tutorial/"},{"label":"Python path and file interfaces","url":"https://docs.python.org/3/library/pathlib.html"}],"hints":["Learn the basic language pieces separately before connecting them into a CLI.","Define a record-counting function independently of argument parsing and output formatting.","Read and validate all input before printing the report so a late decoding failure cannot leave a partial success-shaped output."],"checks":["The sample counts four nonblank records and three distinct case-sensitive words.","Empty input and a final unterminated record follow the stated contracts.","Missing and undecodable files produce the fixed stderr message and status 3 with no partial stdout.","The program receives a spaced path as one argument and never invokes a shell.","Explain the basic Python constructs you used before starting subprocess integration."],"quiz":[{"prompt":"Why are Apple and apple distinct in this mission?","options":["Python cannot compare strings","The contract preserves case","All strings are filesystem paths","The operating system renames words"],"correct":1,"clue":"Separate a data-normalization choice from default language behavior."},{"prompt":"Why catch the documented input exceptions rather than suppress every exception?","options":["All exceptions mean an empty file","Suppressing errors improves counts","Unexpected programming defects should not be disguised as normal input failures","Exceptions only exist when using a shell"],"correct":2,"clue":"Distinguish anticipated user errors from bugs in your implementation."}]},{"id":"s07m02","title":"Use a virtual environment and a real CLI parser","minutes":135,"brief":"Create a local virtual environment named .venv and record the interpreter path used to run your program; no external packages are needed. Write word-count.py with an argument parser accepting one input path and an optional --minimum integer, default 1. Reuse the word-record rules from analyze.py and include only words whose occurrence count reaches the minimum. For the same words.txt and minimum 2, output exactly pear\\t2\\n. At the default minimum, output Apple\\t1\\napple\\t1\\npear\\t2\\n in Python string order. No qualifying words yields empty stdout and status 0. --minimum must be positive: invalid values or usage have status 2, empty stdout, and nonempty parser diagnostics. --help has status 0 and help text on stdout. Input errors keep analyze.py's status 3 and fixed diagnostic.","deliverables":["word-count.py and .venv within the mission workspace.","environment-notes.txt containing the observed environment interpreter path and an explanation of activation versus explicitly selecting that interpreter.","test-notes.md for default, threshold 2, threshold 3, threshold 0, noninteger threshold, help, missing input, and an input filename beginning with a hyphen."],"research":[{"label":"Python virtual environments","url":"https://docs.python.org/3/library/venv.html"},{"label":"Python argparse","url":"https://docs.python.org/3/library/argparse.html"}],"hints":["Use an environment to select dependencies and interpreter identity, not to claim filesystem confinement.","Let the parser handle option structure and help, but define the positive-threshold constraint explicitly.","Sort the final dictionary items deliberately, and investigate how the parser marks the end of options for a hyphen-leading path."],"checks":["The two sample thresholds produce exactly the required ordered records.","No qualifying words is a successful empty result, not an input failure.","Invalid thresholds fail before report output; help is successful and does not read an input file.","The recorded interpreter belongs to .venv, and the program needs no downloaded dependency.","A literal hyphen-leading filename can be supplied without becoming an option."],"quiz":[{"prompt":"Does a virtual environment prevent a Python program from reading ordinary files outside the project?","options":["Yes, it is a filesystem jail","Yes, if its name begins with a dot","Only when activated twice","No, it is not that kind of security boundary"],"correct":3,"clue":"Review what environment isolation covers and what operating-system permissions govern."},{"prompt":"Why use an argument parser rather than manually guessing option positions?","options":["It provides consistent option parsing, help, and usage diagnostics","It automatically validates every application rule","It converts every input file to JSON","It removes the need to test argument boundaries"],"correct":0,"clue":"Separate CLI syntax handling from your own semantic validation."}]},{"id":"s07m03","title":"Validate and transform JSON as data","minutes":150,"brief":"Write summarize-json.py accepting one UTF-8 JSON file. Its root must be an array of objects having exactly name and count fields; name is a nonempty string, count is an integer at least zero, and booleans are not counts. Reject duplicate names, extra fields, wrong root type, and malformed JSON. Fixture input is the data [{\"name\":\"two words\",\"count\":2},{\"name\":\"quote\\\"name\",\"count\":0},{\"name\":\"line\\nbreak\",\"count\":3}]. Output one JSON object with exactly items:3, total:5, and names:[\"line\\nbreak\",\"quote\\\"name\",\"two words\"] in Python string order, followed by a newline. Empty input array produces items:0, total:0, names:[]. Syntax/schema errors yield empty stdout, stderr error: invalid data, status 2; file/encoding errors yield error: cannot read UTF-8 input, status 3. Success has status 0 and empty stderr.","deliverables":["summarize-json.py, the valid fixture, and separate invalid fixtures for boolean count, duplicate name, negative count, extra field, wrong root, and truncated JSON.","test-notes.md comparing parsed output values and proving escaped characters round-trip as data."],"research":[{"label":"Python JSON encoding and decoding","url":"https://docs.python.org/3/library/json.html"},{"label":"Python tutorial: dictionaries and types","url":"https://docs.python.org/3/tutorial/"}],"hints":["JSON syntax validity and your application's schema are different layers.","Validate container shapes and exact field types before aggregating any totals.","Use the JSON library for both decoding and encoding; check Python's relationship between booleans and integers when enforcing the count rule."],"checks":["The sample output has exactly three keys, correct totals, and the requested ordered names.","The quote and actual newline survive a parse-serialize-parse round trip.","Every schema or syntax failure has status 2 and zero stdout bytes.","A boolean count is rejected rather than counted as 0 or 1.","No JSON value is evaluated as Python or shell source, and no JSON text is handcrafted with string interpolation."],"quiz":[{"prompt":"Why is successfully decoding JSON not sufficient validation?","options":["Decoded JSON always contains executable commands","The application still needs to enforce its own schema and constraints","JSON can represent only strings","Decoding verifies every path exists"],"correct":1,"clue":"Compare a syntactically valid value with the specific record shape the mission accepts."},{"prompt":"What should happen to a name containing a quote or newline?","options":["Execute it as shell syntax","Delete those characters silently","Preserve it as string data through JSON serialization","Split it into separate command-line options"],"correct":2,"clue":"Think about round-tripping values instead of manipulating their printed spelling."}]}]},{"id":"s08","title":"Subprocesses, integration, and the manifest capstone","summary":"Cross the Bash/Python boundary with explicit arguments, statuses, timeouts, and structured reports. Finish with an adversarial-path manifest workflow and evidence-based review.","exam":[{"prompt":"Which subprocess design preserves data as arguments without asking a shell to interpret it?","options":["A command string joined with spaces and shell=True","JSON pasted into eval","A filename appended to shell source","An argument sequence passed with shell=False"],"correct":3,"clue":"Identify where shell-language parsing is introduced and where it can be avoided."},{"prompt":"What does check=True contribute to a completed subprocess call?","options":["It raises an exception for a nonzero child status","It guarantees a timeout cannot occur","It validates the child's JSON schema automatically","It makes all children run without filesystem access"],"correct":0,"clue":"Separate process outcome handling from output validation and time limits."},{"prompt":"What practical evidence is required before calling the capstone complete?","options":["A perfect quiz score alone","Recorded fixture, failure, dry-run, and adversarial-path test runs","A screenshot of the editor only","A claim that strict mode handles every failure"],"correct":1,"clue":"Review the difference between knowing concepts and demonstrating interface behavior."}],"missions":[{"id":"s08m01","title":"Call a Python worker without a shell","minutes":165,"brief":"Write worker.py with --mode echo, fail, or wait and an optional --value required only for echo. echo outputs JSON with exactly value equal to the supplied string, status 0, empty stderr. fail emits stderr worker: deliberate failure, no stdout, and status 7. wait stays idle for at most five seconds. Then write run-worker.py accepting the same mode/value and a positive --timeout in seconds, default 1. Launch the worker using the current Python interpreter, an argument list, shell=False, check=True, captured streams, UTF-8 decoding, and the timeout. Validate echo output as exactly one object with one string value before emitting it as JSON. Child nonzero becomes empty stdout, stderr error: worker failed (7), status 4; timeout becomes error: worker timed out, status 5; invalid worker JSON becomes error: invalid worker report, status 6. Wrapper usage errors have status 2. Test an echo value with spaces, quotes, a newline, semicolons, and a literal dollar sign: it must round-trip without execution.","deliverables":["worker.py and run-worker.py with explicit child and wrapper interfaces.","test-notes.md covering echo round-trip, deliberate failure, timeout, invalid usage, and invalid JSON from a disposable test double replacing the worker only in a private copied test workspace.","A note distinguishing argument safety, process status checking, timeout handling, and JSON validation."],"research":[{"label":"Python subprocess.run and security considerations","url":"https://docs.python.org/3/library/subprocess.html"},{"label":"Python JSON","url":"https://docs.python.org/3/library/json.html"}],"hints":["Each executable, option, and value belongs in its own argument element.","Treat completed failure, timeout, and malformed successful output as different cases.","Catch the documented subprocess exceptions and validate decoded output separately. A timeout manages this direct worker, not an arbitrary descendant process tree."],"checks":["The adversarial echo value is identical after JSON decoding, with no unexpected files or processes.","The wrapper uses an argument list, explicit shell=False, check=True, and a finite timeout.","The deliberate status 7 and timeout become the distinct documented wrapper failures with no stdout.","A zero-status test double emitting malformed JSON produces wrapper status 6.","The timeout test leaves no direct worker running; document the direct-child limitation."],"quiz":[{"prompt":"A child exits zero but prints malformed JSON. What remains necessary?","options":["Assume the report is valid","Run the text through a shell","Validate the output protocol independently of process success","Discard the timeout configuration"],"correct":2,"clue":"A successful process status does not establish the shape of its data."},{"prompt":"What does a finite subprocess timeout protect against in this mission?","options":["Every possible filesystem race","All malformed JSON","All malicious grandchildren automatically","Waiting indefinitely for the direct worker to complete"],"correct":3,"clue":"Separate bounded waiting from broader security and process-tree claims."}]},{"id":"s08m02","title":"Build a read-only manifest scanner","minutes":210,"brief":"Write scan.py accepting --root PATH and producing a single JSON report with exactly version:1, files:[], errors:[], and skipped_symlinks:0 fields. Recursively include nonsymlink regular files under a nonsymlink directory root. Each file record has exactly path (root-relative POSIX spelling) and bytes (nonnegative file size). Sort file records and errors by their path using Python string order. Never follow symlink files or symlink directories; count each encountered link once in skipped_symlinks. Ignore ordinary directories themselves. The fixture root contains empty.txt (zero bytes), two words.txt (three bytes abc), nested/data.json (three bytes {} plus newline), -n.txt (one byte x), semi;colon.txt (one byte y), $(literal).txt (one byte z), and line\\nbreak.txt (one byte q), plus one file symlink and one directory symlink to locations outside root. Expect seven file records with those exact sizes, empty errors, skipped_symlinks=2, status 0, and empty stderr. Empty root is a successful empty report. Reject a missing, symlink, or nondirectory root with files:[], errors:[{path:'.',code:'ROOT_INVALID'}], skipped_symlinks:0, stderr error: scan incomplete, and status 3. For an inaccessible directory report its relative path with code READ_FAILED and do not traverse it; for an unreadable or failed-to-inspect regular file report its path with code READ_FAILED and omit that file. Other object kinds yield code UNSUPPORTED and are omitted. Any such partial report has status 3 and the same stderr line. Usage errors have status 2, parser diagnostics, and no JSON. Do not read file contents, execute filenames, or change input data; check regular-file readability under ordinary-user permissions, not just metadata availability.","deliverables":["scan.py and the exact fixture tree, with symlink targets outside root but inside the mission sandbox.","A manifest.json report from the fixture and test-notes.md comparing its parsed schema, sorted paths, byte sizes, symlink count, stdout/stderr, and status.","Failure fixtures for invalid roots, a FIFO or other safely created nonregular object, and permission denial where reproducible as an ordinary user.","A limitation note: no race-free security boundary, stable snapshot guarantee, content hash, or arbitrary non-UTF-8 filename-byte support is claimed; a moving filesystem may produce a partial report."],"research":[{"label":"Python pathlib","url":"https://docs.python.org/3/library/pathlib.html"},{"label":"Python os traversal and filesystem errors","url":"https://docs.python.org/3/library/os.html"},{"label":"Python JSON","url":"https://docs.python.org/3/library/json.html"}],"hints":["Design the report schema and failure policy before traversal.","Classify symlink objects without following them, and keep paths as values until JSON serialization.","Sort completed records for deterministic output. Handle traversal failures where they occur, and remember that a metadata lookup alone does not prove a file is readable."],"checks":["The main fixture yields seven records with sizes 0, 3, 3, 1, 1, 1, 1 attached to their correct paths, not to traversal order.","The real newline in one name round-trips through JSON as part of one path value.","Neither external symlink target appears in files, and skipped_symlinks is exactly 2.","Missing, symlink, and file roots each produce the exact ROOT_INVALID report and status 3.","A nonregular object yields UNSUPPORTED without blocking on it.","Permission denial yields a sorted partial error report where meaningfully reproducible; otherwise mark that test skipped, not passed.","All input file bytes, names, and link targets remain unchanged."],"quiz":[{"prompt":"Why use JSON for a manifest containing newline-bearing names?","options":["It preserves each path as a structured string value","It makes the filesystem immutable","It treats each newline as a new file automatically","It permits shell execution of every record"],"correct":0,"clue":"Compare structured string values with a one-filename-per-line convention."},{"prompt":"Why is a readable metadata record insufficient for the scanner's readability rule?","options":["Metadata always contains file contents","Inspecting metadata and having read access are different conditions","Directories have no permissions","JSON decides operating-system access rights"],"correct":1,"clue":"Separate learning a file's size from the access policy the contract requires."}]},{"id":"s08m03","title":"Capstone: dry-run manifest publication","minutes":300,"brief":"Build manifest.sh, a Bash orchestrator around your scan.py. Accept exactly --root PATH --output PATH and optional --dry-run, in any option order, with no duplicates; values may contain spaces or leading hyphens and belong to their preceding option. Unknown/missing options yield status 2, nonempty stderr, and empty stdout before work. The output's parent must exist, be user-owned, and be outside the scan root; the output itself must not already exist, including as a broken symlink. Unsafe/occupied output yields empty stdout, stderr error: unsafe output, status 4, and no changes. In this cooperative sandbox no concurrent writers are assumed; state that constraint. Invoke the scanner through a Bash argument array and an intentionally selected Python interpreter, never eval or constructed shell source. Validate the scanner JSON and status using a Python JSON consumer rather than text search or shell interpolation. On scanner success, stdout is the validated scanner report and stderr is empty. With --dry-run, status is 0 and neither output nor persistent application files are created. Without it, stage a complete report in a private directory in the output parent, then publish output only after successful validation; output must parse identically to stdout and status is 0. Remove this run's staging directory on success, failure, and catchable termination. Scanner status 3 produces its validated partial report on stdout, stderr error: scan incomplete, status 3, and no output file in either mode. A scanner invocation failure or malformed report yields empty stdout, stderr error: scanner failed, status 5, and no output file. Publication failure yields empty stdout, stderr error: publish failed, status 4. Catchable TERM exits 143 without publishing partial data and cleans only this run's staging data. Use the seven-file fixture from the previous mission under a root named source files and publish outside it to reports/manifest one.json. Add a preexisting unrelated sentinel. The scanner remains read-only; publication is the only intended persistent change. Deliver a workflow, not a hosted service, and do not claim protection from hostile concurrent filesystem changes.","deliverables":["manifest.sh, scan.py, and any small Python report-validation helper, with documented dependencies and CLI behavior.","README.md explaining setup, the argument contract, status meanings, dry-run semantics, supported filenames, symlink policy, direct-child/process limitations, and the cooperative-workspace concurrency boundary; do not include a downloadable execution pipeline.","A regression harness with at least twelve named cases: normal publication, dry-run, spaced root/output, leading-hyphen root spelling, newline-bearing input name, empty root, invalid root, occupied output, broken-sym
